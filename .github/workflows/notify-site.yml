name: Trigger site rebuild on release

on:
  release:
    types: [published]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger turkod-site deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.TRIGGER_SITE_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/YusufX-sys/turkod-site/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'