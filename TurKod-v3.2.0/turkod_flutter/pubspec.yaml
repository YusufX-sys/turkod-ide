name: turkod_ide
description: TürKod IDE Flutter masaüstü uygulaması
publish_to: "none"
version: 3.2.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  web_socket_channel: ^3.0.1
  file_picker: ^8.1.2
  path: ^1.9.0
  re_editor: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  # Windows ikonu burada ÜRETİLMEZ: araç yalnızca 48 px tek kareli .ico yazıyor ve görev
  # çubuğunda bulanık görünüyordu. build_release.ps1, turkod_ide/turkod.ico'dan çok boyutlu
  # windows/runner/resources/app_icon.ico üretir (ikon_kucult.py).
  windows:
    generate: false
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true